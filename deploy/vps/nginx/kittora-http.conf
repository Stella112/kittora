# Stage 1 (before the certificate exists): plain HTTP for kittora.xyz names only.
# On the shared server, port 80 reaches nginx through a stream multiplexer on 127.0.0.1:8080
# (/etc/nginx/firstbell-stream.conf). On a server where nginx listens on 80 directly, use `listen 80;` instead.
server {
	listen 127.0.0.1:8080;
	server_name kittora.xyz www.kittora.xyz api.kittora.xyz;
	location /.well-known/acme-challenge/ { root /var/www/firstbell-acme; }
	location / { return 308 https://$host$request_uri; }
}
