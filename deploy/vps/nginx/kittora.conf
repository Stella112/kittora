# Stage 2 (after `certbot certonly --cert-name kittora …`): HTTPS for the mini app and the relayer.
# Only answers for kittora.xyz names; other sites on the server are untouched.
server {
	listen 127.0.0.1:8080;
	server_name kittora.xyz www.kittora.xyz api.kittora.xyz;
	location /.well-known/acme-challenge/ { root /var/www/firstbell-acme; }
	location / { return 308 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	server_name www.kittora.xyz;
	ssl_certificate /etc/letsencrypt/live/kittora/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/kittora/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	return 308 https://kittora.xyz$request_uri;
}

# Mini app (static build served by the kittora web container)
server {
	listen 443 ssl;
	server_name kittora.xyz;
	ssl_certificate /etc/letsencrypt/live/kittora/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/kittora/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	add_header X-Content-Type-Options nosniff always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	# no X-Frame-Options: Nimiq Pay may embed the mini app
	location / {
		proxy_pass http://127.0.0.1:8280;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}
}

# Relayer API
server {
	listen 443 ssl;
	server_name api.kittora.xyz;
	ssl_certificate /etc/letsencrypt/live/kittora/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/kittora/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	add_header X-Content-Type-Options nosniff always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	client_max_body_size 64k;
	location / {
		proxy_pass http://127.0.0.1:8788;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# The relayer rate-limits per client IP using the first X-Forwarded-For entry: send only the real peer
		# address, never a client-supplied chain.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 60s;
	}
}
